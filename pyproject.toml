[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trbl-paper-2026-1-code"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"]